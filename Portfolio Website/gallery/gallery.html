<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filterable Image gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    
    <section class="projects" id="projects">
         <div class="gallery-container">
            <!--Nav bar-->
            <div class="items-links">
                <span class="item-link menu-active" data-name="all">All</span>
                <span class="item-link" data-name="fun">Fun and Entertainment</span>
                <span class="item-link" data-name="flier">Flier and magazines</span>
                <span class="item-link" data-name="study">Study and relax</span>
            </div>
            <!--Main images-->
            <div class="gallery">
                <div class="project-img" data-name="flier"><img src="flier1.jpg"></div>
                <div class="project-img" data-name="flier"><img src="flier2.jpg"></div>
                <div class="project-img" data-name="flier"><img src="flier3.jpg"></div>
                <div class="project-img" data-name="flier"><img src="flier4.jpg"></div>
                <div class="project-img" data-name="flier"><img src="flier5.jpg"></div>
                <div class="project-img" data-name="fun"><img src="manga1.jpg"></div>
                <div class="project-img" data-name="fun"><img src="manga2.jpg"></div>
                <div class="project-img" data-name="fun"><img src="manga3.jpg"></div>
                <div class="project-img" data-name="fun"><img src="manga4.jpg"></div>
                <div class="project-img" data-name="fun"><img src="manga5.jpg"></div>
                <div class="project-img" data-name="study"><img src="study1.jpg"></div>
                <div class="project-img" data-name="study"><img src="study2.jpg"></div>
                <div class="project-img" data-name="study"><img src="study3.jpg"></div>
                <div class="project-img" data-name="study"><img src="study4.jpg"></div>
                <div class="project-img" data-name="study"><img src="study5.jpg"></div>
            </div>
         </div>
    </section>

    <script src="gallery.js"></script>
</body>
</html>
